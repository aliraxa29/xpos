name: Linters

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: linters-xpos-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Backend linters (Python)
  # -------------------------------------------------------------------
  backend-linters:
    name: Backend Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch,prettier,eslint

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        run: |
          semgrep ci \
            --config ./frappe-semgrep-rules/rules \
            --config r/python.lang.correctness \
            --exclude-rule "frappe-semgrep-rules.rules.security.missing-argument-type-hint"

  # -------------------------------------------------------------------
  # Frontend linters (Vue.js / TypeScript)
  # -------------------------------------------------------------------
  frontend-linters:
    name: Frontend Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: |
          cd frontend
          test -f yarn.lock || { echo "::error::frontend/yarn.lock is missing. Commit the lockfile to keep CI reproducible."; exit 1; }
          yarn install --frozen-lockfile

      - name: TypeScript type check
        run: |
          cd frontend
          yarn typecheck

      - name: Run frontend tests
        run: |
          cd frontend
          yarn test:run
